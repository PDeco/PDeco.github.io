<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Live Lorenz Attractor</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
    
    body, html {
    margin: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    }
    label { margin-right: 10px; }
    input[type=range] { width: 150px; }
    #plot {
    width: 100vw;
    height: 100vh;

    /* Important: allow plot to receive pointer events */
    pointer-events: auto;
    }
</style>
</head>
<body>

<div>
  <label for="sigma">σ</label>
  <input id="sigma" type="range" min="0" max="30" step="0.1" value="10">

  <label for="rho">ρ</label>
  <input id="rho" type="range" min="0" max="50" step="0.1" value="28">

  <label for="beta">β</label>
  <input id="beta" type="range" min="0" max="10" step="0.01" value="2.667">

  <label for="trail">Trail</label>
  <input id="trail" type="range" min="10" max="2000" step="10" value="1000">
</div>

<div id="plot"></div>

<script>
let currentCamera = null;
let sigma = 10, rho = 28, beta = 2.667, dt = 0.01;
let x = 1, y = 1, z = 1;
let trailLength = 1000;

let xs = [], ys = [], zs = [], pointColors = [];

function updateParameters() {
  sigma = parseFloat(document.getElementById('sigma').value);
  rho = parseFloat(document.getElementById('rho').value);
  beta = parseFloat(document.getElementById('beta').value);
  trailLength = parseInt(document.getElementById('trail').value);
}

// Initial plot
Plotly.newPlot('plot', [
  {
    x: xs, y: ys, z: zs,
    mode: 'lines',
    type: 'scatter3d',
    line: { width: 2, color: '#1f77b4' },
    name: 'Trail'
  },
  {
    x: [x], y: [y], z: [z],
    mode: 'markers',
    type: 'scatter3d',
    marker: { size: 4, color: 'red' },
    name: 'Current State'
  }
], {
  scene: {
    xaxis: { title: 'X', range: [-50, 50] },
    yaxis: { title: 'Y', range: [-50, 50] },
    zaxis: { title: 'Z', range: [-20, 70] },
    camera: {}
  },
  margin: { l: 0, r: 0, b: 0, t: 0 }
});

const plotDiv = document.getElementById('plot');

plotDiv.on('plotly_relayout', (eventData) => {
  if (eventData['scene.camera']) {
    currentCamera = eventData['scene.camera'];
  }
});

function getColorFromParams(sigma, rho, beta) {
  let r = Math.min(sigma / 30, 1);
  let g = Math.min(rho / 50, 1);
  let b = Math.min(beta / 10, 1);
  return { r, g, b };
}

function rgbaFromRGB({r, g, b}, alpha) {
  return `rgba(${Math.floor(r * 255)}, ${Math.floor(g * 255)}, ${Math.floor(b * 255)}, ${alpha})`;
}

function stepLorenz() {
  let dx = sigma * (y - x);
  let dy = x * (rho - z) - y;
  let dz = x * y - beta * z;

  x += dx * dt;
  y += dy * dt;
  z += dz * dt;

  xs.push(x);
  ys.push(y);
  zs.push(z);

  const color = getColorFromParams(sigma, rho, beta);
  pointColors.push(color);

  if (xs.length > trailLength + 500) {
    xs = xs.slice(-trailLength - 500);
    ys = ys.slice(-trailLength - 500);
    zs = zs.slice(-trailLength - 500);
    pointColors = pointColors.slice(-trailLength - 500);
  }
}

function animate() {
  updateParameters();
  stepLorenz();

  const len = xs.length;
  const trail = parseInt(document.getElementById('trail').value);
  const start = Math.max(0, len - trail);

  const xTrail = xs.slice(start);
  const yTrail = ys.slice(start);
  const zTrail = zs.slice(start);
  const colorTrail = pointColors.slice(start);

  const rgbaTrail = colorTrail.map((c, i) => {
    const alpha = (i + 1) / colorTrail.length;
    return rgbaFromRGB(c, alpha);
  });

  // Only update the data. The fixed ranges prevent autoscaling.
  Plotly.restyle('plot', {
    x: [xTrail, [x]],
    y: [yTrail, [y]],
    z: [zTrail, [z]],
    'line.color': [rgbaTrail, null]
  });
}

setInterval(animate, 30);
</script>

</body>
</html>
